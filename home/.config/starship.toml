# Промпт в стиле powerline: каждый модуль — цветной сегмент со стрелкой.
# Предыдущая версия (цвет текстом, без плашек) лежит в starship.toml.bak.1791788934.
#
# Роли цветов сохранены, только теперь это цвет фона сегмента:
#   bright-purple — каталог, имя репозитория жирным
#   blue          — ветка
#   yellow        — незакоммиченные изменения и расхождение с origin
#   bright-red    — код возврата упавшей команды, read-only каталог
#   cyan          — рантаймы, docker, kubernetes
#   bright-black  — фоновые задачи, часы справа
#   #ff4f9a       — user@host, только под root или по SSH, в тон обводке окна
#
# Цвета заданы именами ANSI, а не hex, чтобы промпт следовал теме терминала.
# Исключения: user@host (обводка окна) и фон батареи (#292e42, в ANSI нет
# промежуточного серого между фоном и bright-black).
#
# Как устроены стыки. Сегменты контекстные (git пропадает вне репозитория,
# рантаймы — вне проектов), поэтому сосед справа заранее неизвестен. Каждый
# сегмент сам открывается «выемкой» (стрелка цвета фона терминала на своём
# фоне) и закрывается стрелкой своего цвета на пустом фоне. Отсюда шеврон
# с тонким зазором, который не ломается, когда какой-то модуль пропал.
# Глифы  и  — Powerline из Nerd Font (JetBrainsMono Nerd Font).

add_newline = true

# Дефолтные 200 мс легко выбивает git_status на большом репозитории и запрос
# контекста kubernetes — модуль тогда молча пропадает из промпта.
command_timeout = 1000

format = """
$username$hostname$directory$git_branch$git_status$nodejs$golang$java$python$docker_context$kubernetes$jobs$status
$character"""

# Только заряд и часы. Длительность команды ($cmd_duration) убрана по просьбе —
# сам модуль ниже оставлен настроенным, вернуть его можно дописав сюда.
right_format = "$battery$time"

[character]
# Стрелка второй строки: фиолетовая — всё хорошо, красная — команда упала.
success_symbol = "[❯](bold bright-purple)"
error_symbol = "[❯](bold bright-red)"

# --- Где я -----------------------------------------------------------------

[username]
# Всплывает только под root или по SSH — ровно тогда, когда перепутать сессию
# дорого. Под root имя пользователя и так говорит само за себя.
show_always = false
format = "[ $user ]($style)[](fg:#ff4f9a)"
style_user = "bold fg:black bg:#ff4f9a"
style_root = "bold fg:black bg:#ff4f9a"

[hostname]
ssh_only = true
format = "[](fg:black bg:#ff4f9a)[ @$hostname ]($style)[](fg:#ff4f9a)"
style = "bold fg:black bg:#ff4f9a"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "fg:black bg:bright-purple"
repo_root_style = "bold fg:black bg:bright-purple"
read_only = " "
read_only_style = "bold fg:red bg:bright-purple"
format = "[  $path]($style)[$read_only]($read_only_style)[ ](bg:bright-purple)[](fg:bright-purple)"
repo_root_format = "[  ]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)[ ](bg:bright-purple)[](fg:bright-purple)"

# --- Git -------------------------------------------------------------------

[git_branch]
symbol = " "
format = "[](fg:black bg:blue)[ $symbol$branch ]($style)[](fg:blue)"
style = "fg:black bg:blue"

[git_status]
# Внутри жёлтой плашки вложенные цвета не читаются, поэтому все счётчики
# одного цвета и различаются символом. Чистый репозиторий — сегмента нет.
# $ahead_behind добавлен осознанно: без него расхождение с origin невидимо.
format     = '([](fg:black bg:yellow)[ $all_status$ahead_behind ]($style)[](fg:yellow))'
style      = "fg:black bg:yellow"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count} "
untracked  = "?${count} "
modified   = "!${count} "
staged     = "+${count} "
stashed    = "≡${count} "
renamed    = "»${count} "
deleted    = "✘${count} "
up_to_date = ""

# --- Рантаймы: показываются только в каталогах соответствующих проектов ------

[nodejs]
symbol = " "
format = "[](fg:black bg:cyan)[ $symbol($version) ]($style)[](fg:cyan)"
style = "fg:black bg:cyan"

[golang]
symbol = " "
format = "[](fg:black bg:cyan)[ $symbol($version) ]($style)[](fg:cyan)"
style = "fg:black bg:cyan"

[java]
symbol = " "
format = "[](fg:black bg:cyan)[ $symbol($version) ]($style)[](fg:cyan)"
style = "fg:black bg:cyan"

[python]
# Виртуальное окружение важнее версии: перепутанный venv это типовая потеря часа.
symbol = " "
format = '[](fg:black bg:cyan)[ $symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)[](fg:cyan)'
style = "fg:black bg:cyan"

# --- Инфраструктура ---------------------------------------------------------

[docker_context]
# only_with_files по умолчанию true: не мозолит глаза вне docker-проектов.
symbol = " "
format = "[](fg:black bg:cyan)[ $symbol$context ]($style)[](fg:cyan)"
style = "fg:black bg:cyan"

[kubernetes]
# Модуль выключен в starship по умолчанию. Включён, но ограничен каталогами
# k8s-проектов — иначе контекст висел бы в каждой строке, включая ~.
disabled = false
symbol = "☸ "
format = '[](fg:black bg:cyan)[ $symbol$context( \($namespace\)) ]($style)[](fg:cyan)'
style = "fg:black bg:cyan"
detect_files = ["k8s.yaml", "skaffold.yaml", "Chart.yaml", "kustomization.yaml"]
detect_folders = ["k8s", "kubernetes", "helm", ".helm", "manifests"]

# --- Состояние последней команды --------------------------------------------

[jobs]
# Сколько задач висит в фоне. Легко забыть про Ctrl+Z и потом гадать.
symbol = "⇶ "
number_threshold = 1
symbol_threshold = 1
format = "[](fg:black bg:bright-black)[ $symbol$number ]($style)[](fg:bright-black)"
style = "fg:bright-white bg:bright-black"

[status]
# Код виден целиком: 130 (Ctrl+C) и 137 (OOM-kill) читаются мгновенно.
disabled = false
map_symbol = false
pipestatus = true
format = '[](fg:black bg:bright-red)[ ✗ $status ]($style)[](fg:bright-red)'
pipestatus_format = '[](fg:black bg:bright-red)[ ✗ $pipestatus ]($style)[](fg:bright-red)'
style = "bold fg:black bg:bright-red"

[cmd_duration]
# Меньше двух секунд не показывать — иначе цифра мелькает после каждой команды.
min_time = 2000
format = "[](fg:bright-blue)[  $duration ](fg:black bg:bright-blue)"

# --- Правая лента: стрелки смотрят влево ------------------------------------

[battery]
# Ноутбук, и вопрос автономности здесь живой — заряд видно всегда. Порядок
# блоков display важен: starship берёт первый, чей threshold не меньше заряда.
format = "[](fg:#292e42)[ $symbol$percentage ]($style)"
full_symbol = " "
charging_symbol = " "
discharging_symbol = " "
# Unknown — это и «Not charging»: на зарядке, но батарея полная. Отсюда вилка, а не «?».
unknown_symbol = " "
empty_symbol = " "

[[battery.display]]
threshold = 15
style = "bold fg:bright-red bg:#292e42"

[[battery.display]]
threshold = 30
style = "fg:yellow bg:#292e42"

[[battery.display]]
threshold = 100
style = "fg:green bg:#292e42"

[time]
disabled = false
format = "[](fg:bright-black bg:#292e42)[  $time ]($style)"
time_format = "%d.%m.%Y %H:%M:%S"
style = "fg:bright-white bg:bright-black"
