# Change the default Omarchy look'n'feel

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    # No gaps between windows or borders
    gaps_in = 1
    gaps_out = 1
    border_size = 2

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#misc
misc {
    # Adaptive sync (VRR): 0 = off, 1 = on, 2 = only for fullscreen apps
    vrr = 2
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
    # Disable all animations
    # enabled = no

    # Apply opacity changes instantly instead of fading over ~300ms.
    # Without this, window-peek (SUPER+ALT+BACKSPACE) ramps in slowly.
    animation = fadeSwitch, 0, 1, default
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # See only one column per screen instead of two
    # column_width = 0.97
}

# Low-battery warning window from battery-low-warn: big, centred, above
# everything, and present on whatever workspace you happen to be on.
windowrule = float on,      match:class ^battery-warning$
windowrule = size 1100 640, match:class ^battery-warning$
windowrule = center on,     match:class ^battery-warning$
windowrule = pin on,        match:class ^battery-warning$
