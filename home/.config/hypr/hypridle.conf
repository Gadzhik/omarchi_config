general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Screensaver disabled.

# All three listeners are gated on `battery-idle check`, which succeeds only when
# running on battery AND the toggle is on. Idle on AC never does anything; the lid
# switch is separate and stays untouched. Flip it with `battery-idle` (~/.local/bin).

# Turn the display off after 3 minutes.
listener {
    timeout = 180
    on-timeout = /home/igadzhi/.local/bin/battery-idle check && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock system after 5 minutes.
listener {
    timeout = 300
    on-timeout = /home/igadzhi/.local/bin/battery-idle check && omarchy-system-lock
    on-resume = omarchy-system-wake
}

# Suspend after 15 minutes.
listener {
    timeout = 900
    on-timeout = /home/igadzhi/.local/bin/battery-idle check && systemctl suspend
}
