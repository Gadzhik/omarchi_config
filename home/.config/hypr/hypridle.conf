general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Screensaver disabled.

# Turn the display off after 3 minutes, but ONLY when running on battery.
listener {
    timeout = 180
    on-timeout = test "$(cat /sys/class/power_supply/ADP1/online)" = 0 && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock system after 5 minutes, but ONLY when running on battery.
# ADP1/online is 1 when the AC adapter is plugged in, 0 on battery.
listener {
    timeout = 300
    on-timeout = test "$(cat /sys/class/power_supply/ADP1/online)" = 0 && omarchy-system-lock
    on-resume = omarchy-system-wake
}
