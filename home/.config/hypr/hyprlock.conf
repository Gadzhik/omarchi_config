source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 3
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    font_family = JetBrainsMono Nerd Font
    font_size = 110
    color = $font_color
    position = 0, 300
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %d %B'
    font_family = JetBrainsMono Nerd Font
    font_size = 22
    color = $font_color
    position = 0, 200
    halign = center
    valign = center
}

# Battery / power status
label {
    monitor =
    text = cmd[update:10000] printf '%s%% %s' "$(cat /sys/class/power_supply/BAT0/capacity)" "$(cat /sys/class/power_supply/BAT0/status)"
    font_family = JetBrainsMono Nerd Font
    font_size = 16
    color = $font_color
    position = 0, 160
    halign = center
    valign = center
}
