# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Adjust refresh rate / power profile / brightness by AC vs battery
exec-once = uwsm-app -- /home/igadzhi/.local/bin/refresh-rate-by-power

# Remember keyboard layout per window
exec-once = uwsm-app -- /home/igadzhi/.local/bin/per-window-layout

# Never start a session with the idle actions left disabled from last time
exec-once = /home/igadzhi/.local/bin/battery-idle reset

# Big on-screen warning when the battery drops below 20%
exec-once = uwsm-app -- /home/igadzhi/.local/bin/battery-low-warn
