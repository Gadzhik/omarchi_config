# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- thunar
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- thunar "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker

# Bindings for specific apps and web apps live in their own file, which is not
# part of the config repository — see bindings-personal.conf.example.
# Hyprland treats a missing source as a config error, so the file must exist;
# install.sh creates it from the example when it is absent.
source = ~/.config/hypr/bindings-personal.conf

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Show desktop: hide/restore all windows of the current workspace (SUPER+D)
bindd = SUPER, D, Show desktop (toggle), exec, ~/.local/bin/toggle-show-desktop

# Clipboard history on SUPER+V (override default "Universal paste" to avoid double-trigger)
unbind = SUPER, V
bindd = SUPER, V, Clipboard history, exec, omarchy-launch-walker -m clipboard

# Logitech MX Keys
# bind = SUPER SHIFT, S, exec, omarchy-capture-screenshot      # Print Screen Button
# bind = SUPER, H, exec, voxtype record toggle                 # Dictation Button
# bind = SUPER, PERIOD, exec, omarchy-launch-walker -m symbols # Emoji Button

# Toggle the on-battery idle actions (screen off / lock / suspend)
bindd = SUPER SHIFT, I, Battery idle (toggle), exec, ~/.local/bin/battery-idle

# Screen recording, one press to start (pick region with slurp), one press to stop.
# ALT+PRINT still opens the omarchy menu with the audio/webcam variants.
bindd = SUPER ALT, R, Screenrecord (toggle), exec, omarchy-capture-screenrecording
bindd = SUPER ALT SHIFT, R, Screenrecord with audio (toggle), exec, omarchy-capture-screenrecording --with-desktop-audio

# Peek through the focused window while SUPER+ALT+BACKSPACE is held
bindd  = SUPER ALT, BACKSPACE, Peek through window (hold), exec, ~/.local/bin/window-peek on
binddr = SUPER ALT, BACKSPACE, Restore window opacity, exec, ~/.local/bin/window-peek off
