# ASPM: перевести политику линков PCIe с "default" на "powersave".
#
# "default" означает «как оставил BIOS» — на этом ноутбуке это L0s/L1 не
# включёнными на части линков. "powersave" включает их везде, где устройство
# заявляет поддержку. Основной выигрыш — линки к двум NVMe.
#
# Почему tmpfiles, а не pcie_aspm.policy=powersave в cmdline: запись в этот
# параметр работает в рантайме (kernel вызывает pcie_aspm_set_policy и
# переконфигурирует все линки), а лезть в конфиг Limine ради одного значения
# рискованнее, чем один текстовый файл. Откат — удалить файл и перезагрузиться.
#
# Если после перезагрузки в policy остаётся [default] — значит прошивка не
# отдала ОС управление ASPM (aspm_disabled), и запись возвращает EPERM.
# Тогда единственный путь — включить ASPM в BIOS. verify.sh это ловит.
#
# powersupersave не берём осознанно: он разрешает L1 с большими задержками
# выхода, на DRAM-less NVMe это даёт заметные подтормаживания на чтении.

w /sys/module/pcie_aspm/parameters/policy - - - - powersave
