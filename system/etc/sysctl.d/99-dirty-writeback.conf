# Лимиты грязных страниц в байтах, а не в процентах от RAM.
#
# Дефолт: dirty_ratio=20, dirty_background_ratio=10. На 30 ГБ RAM это 6 ГБ
# незаписанных данных. Копирование большого файла на LUKS+btrfs набирает эту
# очередь за секунды, после чего ядро загоняет в balance_dirty_pages ВСЕХ, кто
# коснётся диска — включая композитор и терминал. Слив 6 ГБ через dm-crypt на
# ~180 МБ/с это ~30 с фризов. Планировщик ввода-вывода здесь не помогает:
# троттлинг происходит в слое writeback, выше блочного уровня.
#
# 256 МБ это ~1.5 с очереди на этом железе — отзывчивость сохраняется,
# пропускная способность на последовательной записи не страдает.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
