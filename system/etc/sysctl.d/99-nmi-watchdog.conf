# NMI watchdog выключен — экономия в простое.
#
# Это детектор жёстких зависаний ядра: perf-счётчик раз в секунду на каждом
# ядре проверяет, не застряло ли оно с выключенными прерываниями. На 18 ядрах
# это 18 лишних пробуждений в секунду, которые не дают CPU уйти в глубокие
# C-состояния. powertop первым делом советует выключить именно его.
#
# На ноутбуке пользы от него нет: на hard lockup он лишь печатает трейс в
# лог, который после ребута обычно уже не прочитать. Мягкий watchdog
# (kernel.watchdog, soft lockup) остаётся включённым.
kernel.nmi_watchdog = 0
